<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel | Triagem</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="painel">
    <header>
      <img src="img/logo-triagem.jpg" alt="Triagem" />
      <button class="btn-sair" id="sair">Sair</button>
    </header>

    <div class="card">
      <h2>Bem-vindo, <span id="usuario">...</span>!</h2>
      <p>Login realizado com sucesso. Aqui ficará o Sistema de Triagem do Grupo J.Macedo.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    // Protege a página: sem login, volta para a tela de entrada
    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.href = "index.html";
        return;
      }
      const email = data.session.user.email || "";
      document.getElementById("usuario").textContent = email.split("@")[0];
    });

    document.getElementById("sair").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
